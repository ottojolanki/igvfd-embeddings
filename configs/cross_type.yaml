# Cross-type pool: every Set can retrieve any Set type (secondary experiment; within-type is primary).
name: cross
max_group: 200
pool: all
runs:
  - {name: facets-exact, embedder: none, facets: exact}
  - {name: bge-small, model: BAAI/bge-small-en-v1.5, variant: full, facets: none}
  - {name: bge-small-hyb, model: BAAI/bge-small-en-v1.5, variant: full, facets: exact, w_emb: 0.5}
  - {name: qwen3-0.6b-hyb, model: Qwen/Qwen3-Embedding-0.6B, variant: full, facets: exact, w_emb: 0.5}
